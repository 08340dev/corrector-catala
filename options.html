<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opcions · Corrector de català</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 560px; margin: 0 auto; padding: 32px 20px 48px;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 24px; font-size: 22px; font-weight: 600; }
      .field { margin-bottom: 22px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      .hint { margin: 6px 0 0; font-size: 13px; opacity: 0.75; }
      select, input[type="url"], textarea {
        width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
        border: 1px solid rgba(128, 128, 128, 0.5); border-radius: 6px; background: transparent; color: inherit;
      }
      textarea { min-height: 96px; resize: vertical; }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      button {
        padding: 8px 14px; font: inherit; cursor: pointer; border-radius: 6px;
        border: 1px solid rgba(128, 128, 128, 0.5); background: transparent; color: inherit;
      }
      button.primary { color: #fff; background: #be1e2d; border-color: #be1e2d; font-weight: 600; }
      .footer { display: flex; align-items: center; gap: 12px; }
      #status { font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Corrector de català</h1>

    <div class="field">
      <label for="language">Varietat</label>
      <select id="language">
        <option value="ca-ES">Català general</option>
        <option value="ca-ES-valencia">Valencià</option>
        <option value="ca-ES-balear">Balear</option>
      </select>
    </div>

    <div class="field">
      <label for="serverUrl">Servidor LanguageTool</label>
      <div class="row">
        <input type="url" id="serverUrl" placeholder="https://api.softcatala.org/corrector/v2" />
        <button type="button" id="reset">Restableix</button>
      </div>
      <p class="hint">
        El text que escrius s'envia a aquest servidor per a corregir-lo. Pots fer servir un servidor
        propi, per exemple http://localhost:8081/v2.
      </p>
    </div>

    <div class="field">
      <label for="dictionary">Diccionari personal</label>
      <textarea id="dictionary" spellcheck="false"></textarea>
      <p class="hint">Una paraula per línia. No es marcaran com a errors ortogràfics.</p>
    </div>

    <div class="field">
      <label for="disabledHosts">Llocs on està desactivat</label>
      <textarea id="disabledHosts" spellcheck="false" placeholder="exemple.cat"></textarea>
      <p class="hint">Un lloc per línia.</p>
    </div>

    <div class="footer">
      <button type="button" class="primary" id="save">Desa els canvis</button>
      <span id="status" role="status"></span>
    </div>

    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
