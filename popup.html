<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <title>Corrector de català</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 260px; margin: 0; padding: 14px 16px;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
      label {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 8px 0; cursor: pointer;
      }
      label + label { border-top: 1px solid rgba(128, 128, 128, 0.25); }
      .host { display: block; font-size: 12px; opacity: 0.7; word-break: break-all; }
      input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: #be1e2d; }
      a { display: inline-block; margin-top: 12px; font-size: 13px; color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>Corrector de català</h1>
    <label>
      <span>Corrector activat</span>
      <input type="checkbox" id="enabled" />
    </label>
    <label id="site-row">
      <span>Activat en aquest lloc<span class="host" id="host"></span></span>
      <input type="checkbox" id="site" />
    </label>
    <a href="#" id="options">Opcions</a>
    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
